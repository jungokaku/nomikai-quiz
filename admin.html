<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題作成</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e1b3a">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="admin">
<div class="p-head"><span id="appTitle"></span><span class="head-links"><button id="btnSwitch" class="ghost">開催を切り替え</button><a href="host.html" target="_blank">進行・投影画面を開く ↗</a></span></div>
<div class="a-wrap">
  <div class="a-side">
  <div class="a-panel" id="evPanel"></div>
  <div class="a-panel">
    <h2>問題一覧 <span class="sub" id="qcount"></span></h2>
    <div class="qlist" id="qlist"></div>
    <div class="a-actions"><button class="primary" id="btnNew">＋ 新しい問題</button></div>
  </div>
  </div>
  <div class="a-main">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="editor" aria-selected="true">問題を編集</button>
      <button role="tab" data-tab="survey" aria-selected="false">アンケート <span id="svCount" class="tabcount"></span></button>
    </div>
    <div class="a-panel" id="editor"></div>
    <div class="a-panel hidden" id="surveyPanel"></div>
  </div>
</div>

<script>
(function () {
  const { Store, TYPES, LETTERS, CIRCLED, esc, uid, toArr, sortedQuestions } = Q;
  document.title = '問題作成｜' + Q.C.APP_TITLE;
  document.getElementById('appTitle').textContent = Q.C.APP_TITLE + '｜問題作成';

  let questions = {}, keys = {}, roster = {}, players = {}, meta = {}, catalog = {}, hasBgm = false;
  let draft = null, E = null, EID = '', lastCounts = '';
  let survey = {}, svAns = {}, gen = null, tab = 'editor';
  let bk = {}, bkState = { running: false, done: 0, total: 0, msg: '', err: '' }, bkTimer = null;

  Q.demoBanner();
  Q.eventGate(start, 'admin');

  function start(eid) {
    EID = eid; E = Q.scope('events/' + eid);
    Q.setImageBase('events/' + eid + '/images/');
    E.listen('questions', v => { questions = v || {}; renderList(); syncCounts(); });
    E.listen('keys', v => { keys = v || {}; });
    E.listen('roster', v => { roster = v || {}; renderEvent(); syncCounts(); });
    E.listen('players', v => { players = v || {}; });
    E.listen('bgmName', v => { hasBgm = v || ''; renderEvent(); });
    E.listen('survey', v => { survey = v || {}; renderSurvey(); });
    E.listen('surveyAns', v => { svAns = v || {}; renderSurvey(); autoBackup(); });
    E.listen('surveyBackup', v => { bk = v || {}; renderSurvey(); autoBackup(); });
    Store.listen('catalog', v => { catalog = v || {}; meta = catalog[eid] || {}; renderEvent(); document.title = (meta.title || '') + '｜問題作成'; });
    document.getElementById('btnNew').onclick = () => { draft = blankDraft('choice'); renderEditor(); };
    document.getElementById('btnSwitch').onclick = () => Q.leaveEvent();
    draft = blankDraft('choice');
    renderEditor();
  }
  // 開催一覧に出す件数を更新
  function syncCounts() {
    const qn = Object.keys(questions).length, rn = Object.keys(roster).length;
    const sig = qn + '/' + rn;
    if (meta.title && sig !== lastCounts && (meta.qCount !== qn || meta.rosterCount !== rn)) { lastCounts = sig; Store.update('catalog/' + EID, { qCount: qn, rosterCount: rn }); }
  }

  // ---------- 開催の設定 ----------
  let evOpen = false;
  function renderEvent() {
    const el = document.getElementById('evPanel');
    if (!meta.title) { el.innerHTML = ''; return; }
    const names = Object.entries(roster).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
    const others = Object.entries(catalog).filter(([id]) => id !== EID).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    const focused = document.activeElement && el.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON';
    if (focused) return;
    el.innerHTML = `<div class="ev-head"><div><div class="sub" style="font-size:12px">編集中の開催</div><h2 class="ev-title">${esc(meta.title)}</h2>
        <div class="sub" style="font-size:13px">問題 ${Object.keys(questions).length}問 ・ 名簿 ${names.length}人</div></div>
        <button id="evToggle">${evOpen ? '閉じる' : '設定'}</button></div>
      ${evOpen ? `
      <div class="field"><label>タイトル（スクリーンとスマホに表示）</label>
        <div class="row"><input id="evTitle" maxlength="30" value="${esc(meta.title)}"><button id="evTitleSave">変更</button></div></div>
      <div class="field"><label>パスワードの変更</label>
        <div class="row"><input id="evPass" type="password" autocomplete="new-password" placeholder="新しいパスワード（4文字以上）"><button id="evPassSave">変更</button></div></div>
      <div class="field"><label>参加者名簿（${names.length}人）</label>
        <div class="rchips">${names.map(([rid, r]) => `<span class="rchip">${esc(r.name)}<button data-delr="${rid}" aria-label="${esc(r.name)}を削除">×</button></span>`).join('') || '<span class="sub">名簿なし（当日その場で名前を入力して参加）</span>'}</div>
        <textarea id="evAdd" rows="2" placeholder="名前を追加（改行・読点・カンマ区切りでまとめて入力できます）"></textarea>
        <div class="row"><button id="evAddBtn">名簿に追加</button>${names.length ? '<button id="evClear" class="danger">名簿を空にする</button>' : ''}</div>
        ${others.length ? `<div class="row" style="margin-top:8px"><select id="evFrom">${others.map(([id, m]) => `<option value="${id}">${esc(m.title)}</option>`).join('')}</select><button id="evFromBtn">から引き継ぐ</button></div>
        <p class="mini">選んだ開催の名簿と、実際に参加した人の名前をまとめて追加します（同じ名前は1つにまとめます）。</p>` : ''}</div>
      <div class="field"><label>BGM（任意）</label>
        ${hasBgm ? `<div class="row"><span class="sub">🎵 ${esc(hasBgm)}</span><button id="evBgmDel">削除</button></div>`
          : `<label class="up file">🎵 音源ファイルを選ぶ（mp3など・4MBまで）<input type="file" accept="audio/*" id="evBgm"></label>`}
        <p class="mini">登録すると、受付中と順位表示のBGMがこの音源になります。未登録なら自動で作った音楽が流れます。著作権に問題のない音源を使ってください。</p></div>
      <div class="field"><button id="evDel" class="danger">この開催を削除</button></div>` : ''}`;
    const $ = id => document.getElementById(id);
    $('evToggle').onclick = () => { evOpen = !evOpen; renderEvent(); };
    if (!evOpen) return;
    $('evTitleSave').onclick = async () => {
      const t = $('evTitle').value.trim(); if (!t) return toast('タイトルを入れてください', 'warn');
      await Store.update('catalog/' + EID, { title: t }); toast('タイトルを変更しました');
    };
    $('evPassSave').onclick = async () => {
      const p = $('evPass').value; if (p.length < 4) return toast('パスワードは4文字以上にしてください', 'warn');
      await Store.update('catalog/' + EID, { passHash: await Q.hashPass(p) });
      try { sessionStorage.setItem('quiz_' + (Q.C.ROOM_ID || 'nomikai') + '_evh', await Q.hashPass(p)); } catch (e) {}
      $('evPass').value = ''; toast('パスワードを変更しました');
    };
    const addNames = async list => {
      const have = new Set(Object.values(roster).map(r => r.name));
      const add = [...new Set(list.map(n => n.trim()).filter(n => n && !have.has(n)))];
      if (!add.length) return toast('追加する名前がありません（同じ名前は追加しません）', 'info');
      const start = Object.keys(roster).length, upd = {};
      Object.entries(Q.rosterFromNames(add, start)).forEach(([k, v]) => { upd[k] = v; });
      await E.update('roster', upd); toast(`${add.length}人を名簿に追加しました`);
    };
    $('evAddBtn').onclick = () => { const v = $('evAdd').value; $('evAdd').value = ''; addNames(v.split(/[\n,、，]+/)); };
    if ($('evClear')) $('evClear').onclick = async () => { if (confirm('名簿を空にしますか？')) { await E.set('roster', null); toast('名簿を空にしました', 'info'); } };
    if ($('evFromBtn')) $('evFromBtn').onclick = async () => {
      const src = await Store.get('events/' + $('evFrom').value);
      addNames(Q.rosterNames(src));
    };
    el.querySelectorAll('[data-delr]').forEach(b => b.onclick = () => E.set('roster/' + b.dataset.delr, null));
    if ($('evBgm')) $('evBgm').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 4 * 1024 * 1024) return toast('4MBまでの音源ファイルを選んでください', 'warn');
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); });
      await E.update('', { bgm: url, bgmName: f.name }); toast('BGMを登録しました');
    };
    if ($('evBgmDel')) $('evBgmDel').onclick = async () => { await E.update('', { bgm: null, bgmName: null }); toast('BGMを削除しました', 'info'); };
    $('evDel').onclick = async () => {
      const t = prompt(`「${meta.title}」を問題・名簿・回答ごと削除します。元に戻せません。\n削除する場合は「削除」と入力してください。`);
      if (t !== '削除') return;
      const lv = await Store.get('live');
      await Store.update('', Object.assign({ ['events/' + EID]: null, ['catalog/' + EID]: null }, lv && lv.eid === EID ? { live: null } : {}));
      Q.leaveEvent();
    };
  }
  document.getElementById('evPanel').addEventListener('focusout', () => setTimeout(() => {
    const el = document.getElementById('evPanel');
    if (!el.contains(document.activeElement)) renderEvent();
  }, 0));

  // ---------- 下書き（編集用の形）----------
  function blankEntry() { return { text: '', img: '', photo: '', word: '', group: 0, note: '' }; }
  // 並び替えの順位をそろえる：順位の小さい順に並べ、同じ数字は同率（例：1・2・2・2）。
  // rank が無い項目（古いデータ・アンケートからの下書き）は「前と同率（tie）」から作る
  function normRanks(E) {
    E.forEach((e, i) => { if (e.rank == null || isNaN(e.rank)) e.rank = i > 0 && e.tie ? E[i - 1].rank : i + 1; delete e.tie; });
    const s = E.map((e, i) => [e, i]).sort((a, b) => a[0].rank - b[0].rank || a[1] - b[1]).map(x => x[0]);
    const v = s.map(e => e.rank);
    s.forEach((e, i) => { e.rank = i > 0 && v[i] === v[i - 1] ? s[i - 1].rank : i + 1; });
    E.splice(0, E.length, ...s);
    return E;
  }
  function blankDraft(type) {
    return {
      id: null, type, title: '', timeLimit: 30, shuffle: true, points: 1, img: '',
      hints: [], explain: '', topLabel: '', bottomLabel: '',
      options: [{ text: '', img: '', note: '' }, { text: '', img: '', note: '' }], correct: [0],
      entries: [blankEntry(), blankEntry(), blankEntry(), blankEntry()],
      groups: ['グループ1', 'グループ2']
    };
  }
  function toDraft(q, key) {
    const d = blankDraft(q.type);
    d.id = q.id; d.title = q.title || ''; d.timeLimit = q.timeLimit || 0;
    d.points = Number(q.points) || 1; d.hints = toArr(q.hints).slice(); d.explain = q.explain || ''; d.img = q.img || '';
    d.topLabel = q.topLabel || ''; d.bottomLabel = q.bottomLabel || '';
    const items = toArr(q.items), slots = toArr(q.slots), k = toArr(key);
    if (q.type === 'choice') {
      d.options = toArr(q.options).map(o => ({ text: o.text || '', img: o.img || '', note: o.note || '' }));
      d.correct = Q.choiceKeys(key).filter(n => !isNaN(n));
    } else if (q.type === 'order') {
      d.entries = items.map((it, j) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', _r: Number(k[j]) }))
        .sort((a, b) => a._r - b._r).map((e, i, arr) => { const { _r, ...x } = e; x.tie = i > 0 && arr[i - 1]._r === _r; return x; });
      normRanks(d.entries);
    } else if (q.type === 'match') {
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', photo: (slots[Number(k[i])] || {}).img || '' }));
    } else if (q.type === 'pair') {
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', note: it.note || '', word: (slots[Number(k[i])] || {}).text || '' }));
    } else if (q.type === 'group') {
      d.groups = slots.map(s => s.text || '');
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', group: Number(k[i]) || 0 }));
      d.shuffle = false;
    }
    return d;
  }
  function shuffled(n, doShuffle) {
    const a = [...Array(n).keys()];
    if (doShuffle) for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // 下書き → 保存する形（問題 q と正解 key）。エラーがあれば errors に入れる
  function fromDraft(d) {
    const errors = [];
    const q = { id: d.id || uid(), type: d.type, title: d.title.trim(), timeLimit: Math.max(0, parseInt(d.timeLimit, 10) || 0),
      points: Number(d.points) || 1 };
    const hints = d.hints.map(h => (h || '').trim()).filter(Boolean).slice(0, 5);
    if (hints.length) q.hints = hints;
    if ((d.explain || '').trim()) q.explain = d.explain.trim();
    if (d.img) q.img = d.img;
    const nt = o => ((o && o.note) || '').trim();
    let key;
    if (!q.title) errors.push('問題文を入力してください');
    const has = e => (e.text || '').trim() || e.img;
    if (d.type === 'choice') {
      if (d.options.length < 2) errors.push('選択肢は2つ以上必要です');
      if (d.options.some(o => !has(o))) errors.push('空の選択肢があります（文字か画像を入れてください）');
      q.options = d.options.map(o => ({ text: (o.text || '').trim(), img: o.img || '', note: nt(o) }));
      const cs = [...new Set(toArr(d.correct).map(Number))].filter(n => n >= 0 && n < d.options.length).sort((a, b) => a - b);
      if (!cs.length) errors.push('正解を1つ以上チェックしてください');
      key = cs.length === 1 ? cs[0] : cs;
    } else {
      const E = d.entries;
      if (E.length < 2) errors.push('項目は2つ以上必要です');
      if (E.some(e => !has(e))) errors.push('空の項目があります（文字か画像を入れてください）');
      if (d.type === 'order') {
        // 順位グループ：「前と同率」なら前の項目と同じグループ
        normRanks(E);
        const rv = [...new Set(E.map(e => e.rank))].sort((a, b) => a - b), grp = E.map(e => rv.indexOf(e.rank));
        const p = shuffled(E.length, d.shuffle);           // p[j] = 表示位置jに来る項目（入力順の番号）
        q.items = p.map(r => ({ text: E[r].text.trim(), img: E[r].img || '', note: nt(E[r]) }));
        q.slots = E.map(() => ({ text: '', img: '' }));
        key = p.map(r => grp[r]);
        if (d.topLabel.trim()) q.topLabel = d.topLabel.trim();
        if (d.bottomLabel.trim()) q.bottomLabel = d.bottomLabel.trim();
      } else if (d.type === 'match') {
        if (E.some(e => !e.photo)) errors.push('写真が入っていない項目があります');
        const s = shuffled(E.length, true);                // s[k] = 写真番号kに来る項目
        q.items = E.map(e => ({ text: e.text.trim(), img: e.img || '', note: nt(e) }));
        q.slots = s.map(i => ({ text: '', img: E[i].photo || '' }));
        key = E.map((_, i) => s.indexOf(i));
      } else if (d.type === 'pair') {
        if (E.some(e => !(e.word || '').trim())) errors.push('右側の言葉が空の行があります');
        // 同じ言葉は1つにまとめる（例：B型が2人なら「B型」は1枚、2人とも同じ言葉が正解）
        const words = E.map(e => (e.word || '').trim()), uniq = [...new Set(words)];
        const s = shuffled(uniq.length, true);             // s[k] = 言葉の番号kに来る言葉（uniq の番号）
        q.items = E.map(e => ({ text: e.text.trim(), img: e.img || '', note: nt(e) }));
        q.slots = s.map(u => ({ text: uniq[u], img: '' }));
        key = words.map(w => s.indexOf(uniq.indexOf(w)));
        if (uniq.length < E.length) q.multi = true;
      } else if (d.type === 'group') {
        const G = d.groups.map(g => (g || '').trim());
        if (G.length < 2) errors.push('グループは2つ以上必要です');
        if (G.some(g => !g)) errors.push('グループ名が空です');
        const p = shuffled(E.length, d.shuffle);
        q.items = p.map(i => ({ text: E[i].text.trim(), img: E[i].img || '', note: nt(E[i]) }));
        q.slots = G.map(g => ({ text: g, img: '' }));
        key = p.map(i => Math.min(Number(E[i].group) || 0, G.length - 1));
      }
    }
    return { q, key, errors };
  }
  function imagesOf(q) {
    const ids = [];
    ['options', 'items', 'slots'].forEach(f => toArr(q[f]).forEach(o => { if (o && o.img && !String(o.img).startsWith('sv_')) ids.push(o.img); }));
    if (q.img && !String(q.img).startsWith('sv_')) ids.push(q.img);
    return ids;
  }

  // ---------- 一覧 ----------
  const PTS = [0.5, 1, 1.5, 2, 3, 5, 10];
  function renderList() {
    const qs = sortedQuestions(questions);
    const total = qs.reduce((a, q) => a + (Number(q.points) || 1), 0);
    document.getElementById('qcount').textContent = qs.length + '問' + (qs.length ? `・満点 ${Q.fmt(total)}点` : '');
    const el = document.getElementById('qlist');
    if (!qs.length) { el.innerHTML = '<p class="sub">まだ問題がありません。「新しい問題」から作成してください。</p>'; return; }
    el.innerHTML = qs.map((q, i) => `
      <div class="qitem ${draft && draft.id === q.id ? 'active' : ''}">
        <div><div class="t">Q${i + 1}. ${esc(q.title)}</div><span class="badge">${esc(TYPES[q.type].short)}</span>
          ${q.timeLimit ? `<span class="sub">　${q.timeLimit}秒</span>` : ''}${toArr(q.hints).length ? `<span class="sub">　ヒント${toArr(q.hints).length}</span>` : ''}
          <label class="ptsel">配点<select data-pts="${q.id}" aria-label="Q${i + 1}の配点倍率">${PTS.map(v => `<option value="${v}" ${Number(q.points || 1) === v ? 'selected' : ''}>×${v}</option>`).join('')}</select></label></div>
        <div class="ops">
          <button data-op="up" data-id="${q.id}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-op="down" data-id="${q.id}" ${i === qs.length - 1 ? 'disabled' : ''}>↓</button>
          <button data-op="edit" data-id="${q.id}">編集</button>
          <button data-op="del" data-id="${q.id}" class="danger">削除</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('qlist').addEventListener('change', async e => {
    const s = e.target.closest('select[data-pts]'); if (!s) return;
    await E.set('questions/' + s.dataset.pts + '/points', Number(s.value));
    if (draft && draft.id === s.dataset.pts) { draft.points = Number(s.value); renderEditor(); }
    toast(`配点を ×${s.value} にしました`);
  });
  document.getElementById('qlist').addEventListener('click', async e => {
    const b = e.target.closest('button[data-op]'); if (!b) return;
    const qs = sortedQuestions(questions);
    const i = qs.findIndex(q => q.id === b.dataset.id); const q = qs[i];
    if (b.dataset.op === 'edit') { draft = toDraft(q, keys[q.id]); renderEditor(); renderList(); }
    if (b.dataset.op === 'del') {
      if (!confirm(`「${q.title}」を削除しますか？`)) return;
      const upd = { ['questions/' + q.id]: null, ['keys/' + q.id]: null };
      imagesOf(q).forEach(id => { upd['images/' + id] = null; });
      await E.update('', upd);
      toast('問題を削除しました', 'info');
      if (draft && draft.id === q.id) { draft = blankDraft('choice'); renderEditor(); }
    }
    if (b.dataset.op === 'up' || b.dataset.op === 'down') {
      const j = b.dataset.op === 'up' ? i - 1 : i + 1;
      const upd = {};
      qs.forEach((x, n) => { upd['questions/' + x.id + '/order'] = n; });
      upd['questions/' + qs[i].id + '/order'] = j;
      upd['questions/' + qs[j].id + '/order'] = i;
      await E.update('', upd);
    }
  });

  // ---------- 編集フォーム ----------
  function imgBox(list, i, k, id, label) {
    return `<div class="imgbox">${id ? `<img data-img="${esc(id)}"><button data-act="rmimg" data-list="${list}" data-i="${i}" data-k="${k}">×</button>`
      : `<label class="up">📷 ${label}<input type="file" accept="image/*" data-list="${list}" data-i="${i}" data-k="${k}"></label>`}</div>`;
  }
  function renderEditor() {
    const d = draft, el = document.getElementById('editor');
    let body = '';
    if (d.type === 'choice') {
      body = `<div class="field"><label>選択肢（正解にチェック・<b>複数可</b>）</label>
        ${d.options.map((o, i) => `<div class="erow">
          <div class="lab">${i + 1}</div>

  //  URLと合言葉はこのPCのブラウザにだけ保存（データベースには入れない）
  // =====================================================================
  const bkGet = k => { try { return localStorage.getItem('quiz_backup_' + k) || ''; } catch (e) { return ''; } };
  const bkSet = (k, v) => { try { localStorage.setItem('quiz_backup_' + k, v); } catch (e) {} };
  const bkConf = () => ({ url: bkGet('url'), token: bkGet('token'), auto: bkGet('auto') === '1' });
  // バックアップ対象：アンケートの回答に含まれる画像（顔写真・写真の質問）
  function bkImages() {
    const out = [];
    Object.values(svAns).forEach(r => Object.entries(r.a || {}).forEach(([qid, v]) => {
      if (!String(v).startsWith('sv_')) return;
      const label = qid === Q.FACE ? '顔写真' : ((survey.qs && survey.qs[qid] && survey.qs[qid].label) || '写真');
      out.push({ id: v, person: r.name, question: label, fileName: `${r.name}_${baseOf(label) || label}_${v}.jpg` });
    }));
    return out;
  }
  function backupHtml() {
    const c = bkConf(), all = bkImages(), done = all.filter(x => bk[x.id]).length, pending = all.length - done;
    const ready = c.url && c.token;
    return `<section class="sv-sec bk">

      <div class="bk-grid">
        <label>GASウェブアプリのURL<input id="bkUrl" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label>合言葉<input id="bkToken" type="password" value="${esc(c.token)}" placeholder="スクリプトプロパティ TOKEN と同じ" autocomplete="off"></label>
      </div>
      <p class="mini">URLと合言葉はこのPCのブラウザにだけ保存します。ほかのPCで使うときはもう一度入力してください。</p>
      <div class="row"><button id="bkPing" ${ready ? '' : 'disabled'}>接続テスト</button>
        <label class="chk"><input type="checkbox" id="bkAuto" ${c.auto ? 'checked' : ''} ${ready ? '' : 'disabled'}> この画面を開いている間は自動でバックアップ</label></div>
      <div class="bk-status">
        <div><b>${done}</b> / ${all.length}枚 バックアップ済み${pending ? `　<span class="bk-pend">未バックアップ ${pending}枚</span>` : all.length ? '　<span class="bk-ok">すべて保存済み</span>' : ''}</div>
        ${bkState.running ? `<div class="bk-bar"><span style="width:${bkState.total ? Math.round(bkState.done / bkState.total * 100) : 0}%"></span></div><div class="mini">保存中… ${bkState.done} / ${bkState.total}枚</div>` : ''}
        ${bkState.msg ? `<div class="mini bk-msg">${esc(bkState.msg)}</div>` : ''}
        ${bkState.err ? `<p class="err">${esc(bkState.err)}</p>` : ''}
        <button class="primary" id="bkRun" ${ready && pending && !bkState.running ? '' : 'disabled'}>未バックアップの画像をドライブに保存</button>
      </div>
    </section>`;
  }
  async function gasPost(payload) {
    const c = bkConf();
    // Content-Type を付けない（text/plain）ことで、GAS へ事前確認なしで送れる
    const res = await fetch(c.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: c.token }, payload)) });
    const j = await res.json().catch(() => null);
    if (!j) throw new Error('GASから正しい返事がありません（URLとデプロイ設定を確認してください）');
    if (!j.ok) throw new Error(j.error || '保存に失敗しました');
    return j;
  }
  async function runBackup(silent) {
    if (bkState.running) return;
    const c = bkConf();
    if (!c.url || !c.token) return;
    const list = bkImages().filter(x => !bk[x.id]);
    if (!list.length) { if (!silent) toast('未バックアップの画像はありません', 'info'); return; }
    bkState = { running: true, done: 0, total: list.length, msg: '', err: '' }; renderSurvey();
    try {
      for (const x of list) {
        const data = await E.get('images/' + x.id);
        if (data) {
          const r = await gasPost({ action: 'save', event: meta.title || EID, fileName: x.fileName, data, person: x.person, question: x.question, imageId: x.id });
          await E.set('surveyBackup/' + x.id, { fileId: r.id || '', at: Store.now() });
        }
        bkState.done++; renderSurvey();
      }
      bkState = { running: false, done: 0, total: 0, msg: `${list.length}枚をドライブに保存しました（${new Date().toLocaleTimeString('ja-JP')}）`, err: '' };
      if (!silent) toast(`${list.length}枚をドライブに保存しました`);
    } catch (e) {
      bkState = { running: false, done: 0, total: 0, msg: '', err: 'バックアップできませんでした：' + e.message };
      if (!silent) toast('バックアップできませんでした', 'warn');
    }
    renderSurvey();
  }
  function autoBackup() {
    const c = bkConf();
    if (!c.auto || !c.url || !c.token || bkState.running || bkState.err) return;
    clearTimeout(bkTimer);
    bkTimer = setTimeout(() => runBackup(true), 2000);
  }

  // 問題を作る（設定欄）
  function genHtml(sq) {
    const list = answered(sq), types = GEN_TYPES[kindOf(sq)];
    const max = needsTarget(gen.type) ? 6 : 8;
    const chosen = list.filter(p => gen.pick.includes(p.key));
    const canFace = !sq.face && survey.face !== false && list.some(p => faceOf(p.key));
    return `<div class="gen">
      <div class="row"><span class="sub">問題の形式</span><select data-gen="type" style="width:auto">${types.map(([v, n]) => `<option value="${v}" ${gen.type === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
        ${gen.type === 'order' && sq.kind === 'number' ? `<select data-gen="dir" style="width:auto"><option value="desc" ${gen.dir === 'desc' ? 'selected' : ''}>大きい順</option><option value="asc" ${gen.dir === 'asc' ? 'selected' : ''}>小さい順</option></select>` : ''}</div>
      <div class="sub" style="margin:10px 0 6px">使う人を選ぶ（2〜${max}人）　<button class="linkbtn" data-genop="rand">ランダムに${Math.min(4, list.length)}人</button>　<button class="linkbtn" data-genop="none">選択を外す</button></div>
      <div class="gen-people">${list.map(p => `<label class="gp ${gen.pick.includes(p.key) ? 'on' : ''}"><input type="checkbox" data-gpk="${esc(p.key)}" ${gen.pick.includes(p.key) ? 'checked' : ''}>
        <b>${esc(p.name)}</b><span>${sq.kind === 'photo' ? `<img data-img="${esc(p.v)}" alt="">` : esc(Q.surveyText(sq, p.v))}</span></label>`).join('')}</div>
      ${gen.type === 'what' ? '<p class="mini">選んだ人の回答が選択肢になります（同じ回答は1つにまとめます）。</p>' : ''}
      ${needsTarget(gen.type) && chosen.length ? `<div class="row" style="margin-top:8px"><span class="sub">${gen.type === 'who' ? '正解（出題する回答）' : '主役にする人（正解）'}</span>
        <select data-gen="target" style="width:auto">${chosen.map(p => `<option value="${esc(p.key)}" ${gen.target === p.key ? 'selected' : ''}>${esc(p.name)}${sq.kind === 'photo' ? '' : '：' + esc(Q.surveyText(sq, p.v))}</option>`).join('')}</select></div>` : ''}
      ${canFace && gen.type !== 'whoface' ? `<label class="chk" style="margin-top:8px"><input type="checkbox" data-genface ${gen.face ? 'checked' : ''}> 顔写真を添える${gen.type === 'what' ? '（主役の顔写真を問題に表示）' : '（名前と一緒に表示）'}</label>` : ''}
      <p class="err" id="genErr"></p>
      <div class="row"><button class="primary" data-genop="make">下書きを作る</button><button data-genop="cancel">閉じる</button></div>
    </div>`;
  }

  // 回答 → 問題の下書き
  function buildDraft(sq) {
    const list = answered(sq).filter(p => gen.pick.includes(p.key));
    const max = needsTarget(gen.type) ? 6 : 8;
    if (list.length < 2) return '2人以上選んでください';
    if (list.length > max) return `${max}人までにしてください`;
    const base = baseOf(sq.label), txt = v => Q.surveyText(sq, v);
    const d = blankDraft(['who', 'what', 'whoface', 'faceopt'].includes(gen.type) ? 'choice' : gen.type);
    d.shuffle = true;
    const fimg = p => (gen.face && !sq.face ? faceOf(p.key) : '');
    const entry = (p, extra) => Object.assign(blankEntry(), { text: p.name, note: txt(p.v), img: fimg(p) }, extra || {});
    const target = list.find(p => p.key === gen.target) || list[0];
    if (gen.type === 'order') {
      let rank;
      if (sq.kind === 'pref') {
        rank = p => { const i = Q.PREFS.indexOf(p.v); return i < 0 ? 99 : i; };
        d.title = `${base || '出身地'}が北の人から順番に並べて！`; d.topLabel = '北'; d.bottomLabel = '南';
      } else {
        const desc = gen.dir !== 'asc';
        rank = p => desc ? -Number(p.v) : Number(p.v);
        d.title = `${base}が${desc ? '大きい' : '小さい'}順に並べて！`;
        d.topLabel = desc ? '大きい' : '小さい'; d.bottomLabel = desc ? '小さい' : '大きい';
      }
      const sorted = list.slice().sort((a, b) => rank(a) - rank(b));
      d.entries = sorted.map((p, i) => entry(p, { tie: i > 0 && rank(p) === rank(sorted[i - 1]) }));
      if (d.entries.some(e => e.tie)) d._info = '同じ回答の人は同率（同じ順位）にしました。その人たちはどの順でも正解になります';
    } else if (gen.type === 'pair') {
      d.title = sq.kind === 'pref' ? `それぞれの${base || '出身地'}はどこ？` : `それぞれの${base}は？`;
      d.entries = list.map(p => entry(p, { word: txt(p.v), note: '' }));
      const words = d.entries.map(e => e.word);
      if (new Set(words).size < words.length) d._info = '同じ回答の言葉は1つにまとめます。その人たちは全員同じ言葉で正解になります';
    } else if (gen.type === 'who') {
      d.title = `「${txt(target.v)}」と答えたのは誰？`;
      d.options = list.map(p => ({ text: p.name, img: fimg(p), note: txt(p.v) }));
      // 同じ回答の人は全員正解にする
      d.correct = list.map((p, i) => (txt(p.v) === txt(target.v) ? i : -1)).filter(i => i >= 0);
      if (d.correct.length > 1) d._info = `同じ回答の人が${d.correct.length}人いるので、全員を正解にしました`;
    } else if (gen.type === 'group') {
      const opts = toArr(sq.options).filter(o => list.some(p => p.v === o));
      if (opts.length < 2) return '選んだ人の回答が1種類だけなので、グループ分けにできません';
      d.title = `${sq.label.replace(/[？?]$/, '')}？ それぞれどっち？`;
      d.groups = opts;
      d.entries = list.map(p => entry(p, { group: Math.max(0, opts.indexOf(p.v)) }));
      d.shuffle = true;
    } else if (gen.type === 'match') {
      d.title = sq.face ? 'それぞれの顔写真は誰？' : `${base}は誰のもの？`;
      d.entries = list.map(p => entry(p, { photo: p.v, note: '', img: sq.face ? '' : fimg(p) }));
    } else if (gen.type === 'whoface') {
      d.title = 'この人は誰？';
      d.img = target.v;
      d.options = list.map(p => ({ text: p.name, img: '', note: '' }));
      d.correct = [list.indexOf(target)];
    } else if (gen.type === 'faceopt') {
      d.title = `${target.name}さんはどの人？`;
      d.options = list.map(p => ({ text: '', img: p.v, note: p.name }));
      d.correct = [list.indexOf(target)];
    } else if (gen.type === 'what') {
      let opts;
      if (sq.kind === 'choice') opts = toArr(sq.options).slice(0, 6);
      else opts = [...new Set(list.map(p => txt(p.v)))];
      if (!opts.includes(txt(target.v))) opts.unshift(txt(target.v));
      opts = opts.slice(0, 6);
      if (opts.length < 2) return '選んだ人の回答が1種類だけなので、選択問題にできません';
      d.title = `${target.name}さんの${base}は？`;
      d.img = gen.face ? faceOf(target.key) : '';
      d.options = opts.map(o => ({ text: o, img: '', note: list.filter(p => txt(p.v) === o).map(p => p.name).join('、') }));
      d.correct = [opts.indexOf(txt(target.v))];
      d.explain = '';
      return d;
    }
    d.explain = '';
    return d;
  }

  const svPanel = document.getElementById('surveyPanel');
  svPanel.addEventListener('click', async e => {
    const t = e.target;
    if (t.id === 'bkRun') { bkState.err = ''; return runBackup(false); }
    if (t.id === 'bkPing') {
      try { const r = await gasPost({ action: 'ping' }); bkState.err = ''; bkState.msg = `接続できました（保存先フォルダ：${r.folder}）`; toast('ドライブに接続できました'); }
      catch (er) { bkState.msg = ''; bkState.err = '接続できませんでした：' + er.message; toast('接続できませんでした', 'warn'); }
      renderSurvey(); return;
    }
    if (t.id === 'svCopy') { try { await navigator.clipboard.writeText(surveyUrl()); toast('URLをコピーしました'); } catch (er) { document.getElementById('svUrl').select(); toast('URLを選択しました。コピーしてください', 'info'); } return; }
    if (t.id === 'svPeopleBtn') {
      const inp = document.getElementById('svPeopleAdd');
      const have = new Set(Object.values(survey.people || {}).map(r => r.name));
      const add = [...new Set(inp.value.split(/[、,，\n]+/).map(x => x.trim()).filter(n => n && !have.has(n)))];
      if (!add.length) return toast('追加する名前がありません（同じ名前は追加しません）', 'info');
      const start = Object.keys(survey.people || {}).length, upd = {};
      add.forEach((n, i) => { upd['people/p' + uid()] = { name: n, order: start + i }; });
      inp.value = ''; await E.update('survey', upd); return toast(`${add.length}人を回答者に追加しました`);
    }
    if (t.id === 'svPeopleClear') { if (confirm('回答者リストを空にしますか？（回答は残ります）')) { await E.set('survey/people', null); toast('回答者リストを空にしました', 'info'); } return; }
    const pd = t.closest('[data-svpdel]');
    if (pd) { await E.set('survey/people/' + pd.dataset.svpdel, null); return; }
    if (t.id === 'svAdd') {
      const label = document.getElementById('svLabel').value.trim(), kind = document.getElementById('svKind').value;
      if (!label) return toast('質問を入れてください', 'warn');
      return addSq({ kind, label, options: kind === 'choice' ? ['はい', 'いいえ'] : undefined });
    }
    const tp = t.closest('[data-tpl]'); if (tp) return addSq(Q.SURVEY_TEMPLATES[+tp.dataset.tpl]);
    const dl = t.closest('[data-svdel]');
    if (dl) { if (confirm(`${svAns[dl.dataset.svdel].name} さんの回答を削除しますか？`)) { await E.set('surveyAns/' + dl.dataset.svdel, null); toast('回答を削除しました', 'info'); } return; }
    const op = t.closest('[data-svop]');
    if (op) {
      const Qs = svQs(), i = Qs.findIndex(q => q.id === op.dataset.id), q = Qs[i] || sqById(op.dataset.id);
      if (op.dataset.svop === 'del') { if (confirm(`質問「${q.label}」を削除しますか？（回答は残ります）`)) await E.set('survey/qs/' + q.id, null); }
      if (op.dataset.svop === 'up' || op.dataset.svop === 'down') {
        const j = op.dataset.svop === 'up' ? i - 1 : i + 1, upd = {};
        Qs.forEach((x, n) => { upd['qs/' + x.id + '/order'] = n; });
        upd['qs/' + Qs[i].id + '/order'] = j; upd['qs/' + Qs[j].id + '/order'] = i;
        await E.update('survey', upd);
      }
      if (op.dataset.svop === 'gen') {
        const list = answered(q);
        gen = { qid: q.id, type: GEN_TYPES[kindOf(q)][0][0], dir: 'desc', pick: shuffle(list.map(p => p.key)).slice(0, 4), target: '',
          face: !q.face && survey.face !== false && list.some(p => faceOf(p.key)) };
        renderSurvey();
      }
      return;
    }
    const g = t.closest('[data-genop]');
    if (g) {
      const sq = sqById(gen.qid), list = answered(sq);
      if (g.dataset.genop === 'rand') gen.pick = shuffle(list.map(p => p.key)).slice(0, 4);
      if (g.dataset.genop === 'none') gen.pick = [];
      if (g.dataset.genop === 'cancel') gen = null;
      if (g.dataset.genop === 'make') {
        const d = buildDraft(sq);
        if (typeof d === 'string') { document.getElementById('genErr').textContent = d; return; }
        const warn = d._warn, info = d._info; delete d._warn; delete d._info;
        draft = d; gen = null;
        setTab('editor'); renderEditor(); renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toast(warn || info || '下書きを作りました。内容を確認して「保存」してください', warn ? 'warn' : info ? 'info' : 'ok');
        return;
      }
      renderSurvey();
    }
  });
  svPanel.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'svOpen') { await E.update('survey', { open: t.checked }); toast(t.checked ? 'アンケートの受付を開始しました' : 'アンケートの受付を停止しました', 'info'); return; }
    if (t.id === 'bkUrl') { bkSet('url', t.value.trim()); bkState.err = ''; renderSurvey(); return; }
    if (t.id === 'bkToken') { bkSet('token', t.value); bkState.err = ''; renderSurvey(); return; }
    if (t.id === 'bkAuto') { bkSet('auto', t.checked ? '1' : ''); bkState.err = ''; renderSurvey(); autoBackup(); return; }
    if (t.id === 'svFace') { await E.update('survey', { face: t.checked }); return; }
    if (t.id === 'svFaceReq') { await E.update('survey', { faceReq: t.checked }); return; }
    if (t.hasAttribute('data-genface')) { gen.face = t.checked; renderSurvey(); return; }
    if (t.dataset.sv && t.dataset.k === 'req') { await E.set(`survey/qs/${t.dataset.sv}/req`, t.checked || null); return; }
    if (t.dataset.sv) {
      const k = t.dataset.k;
      let v = t.value.trim();
      if (k === 'options') v = v.split(/[、,，\n]+/).map(x => x.trim()).filter(Boolean);
      if (k === 'label' && !v) return;

    }
    if (t.dataset.gpk !== undefined) {

  });
  svPanel.addEventListener('focusout', () => setTimeout(() => { if (!svPanel.contains(document.activeElement)) renderSurvey(); }, 0));
  async function addSq(t) {
    const id = 's' + uid(), order = svQs().length;
    const q = { id, kind: t.kind, label: t.label, order };
    if (t.options) q.options = t.options.slice();
    if (t.unit) q.unit = t.unit;
    await E.set('survey/qs/' + id, q);
    toast('質問を追加しました');
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // 配点・ヒント・説明（すべて任意）
  function extrasHtml(d) {
    const lab = i => d.type === 'choice' ? String(i + 1) : d.type === 'order' ? CIRCLED[((d.entries[i] || {}).rank || i + 1) - 1] : LETTERS[i];
    const src = d.type === 'choice' ? d.options : d.entries;

      <div class="field"><label>配点倍率</label>

        <p class="mini">問題一覧からも変更できます。</p></div>

          <input data-list="${listKey}" data-i="${i}" data-k="note" value="${esc(o.note || '')}" placeholder="例：北海道・札幌市の出身" maxlength="60"></div>`).join('')}</div>

  const ed = document.getElementById('editor');
  ed.addEventListener('input', e => {
    const t = e.target;
    if (t.type === 'file' || t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT') return;
    setValue(t, t.value);
  });
  ed.addEventListener('change', async e => {
    const t = e.target;
    if (t.type === 'file') {
      const f = t.files[0]; if (!f) return;
      try {
        const data = await Q.compressImage(f);
        const id = 'img_' + uid();
        await E.set('images/' + id, data);
        if (t.dataset.qimg) draft.img = id;
        else draft[t.dataset.list][+t.dataset.i][t.dataset.k] = id;
        renderEditor();
        toast('画像を追加しました', 'info');
      } catch (err) { toast('画像を読み込めませんでした。JPEGかPNGを選んでください', 'warn'); }
      return;
    }
    if (t.dataset.cor !== undefined) {
      const n = +t.dataset.cor, c = new Set(toArr(draft.correct).map(Number));
      t.checked ? c.add(n) : c.delete(n); draft.correct = [...c].sort((a, b) => a - b); return;
    }
    if (t.dataset.rank !== undefined) { draft.entries[+t.dataset.rank].rank = Number(t.value); normRanks(draft.entries); renderEditor(); return; }
    if (t.type === 'checkbox') { draft[t.dataset.f] = t.checked; return; }
    if (t.tagName === 'SELECT') {
      if (t.dataset.f === 'type') { draft.type = t.value; renderEditor(); return; }
      if (t.dataset.f === 'points') { draft.points = Number(t.value); return; }
      setValue(t, +t.value);
    }
  });
  function setValue(t, v) {
    if (t.dataset.f) { draft[t.dataset.f] = v; return; }
    const list = draft[t.dataset.list], i = +t.dataset.i;
    if (!list) return;
    if (t.dataset.k) list[i][t.dataset.k] = v; else list[i] = v;
  }
  ed.addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const act = b.dataset.act, list = draft[b.dataset.list], i = +b.dataset.i;
    if (act === 'add') {
      if (b.dataset.list === 'options') list.push({ text: '', img: '', note: '' });
      else if (b.dataset.list === 'groups') list.push('グループ' + (list.length + 1));
      else if (b.dataset.list === 'hints') { if (list.length < 5) list.push(''); }
      else list.push(Object.assign(blankEntry(), draft.type === 'order' ? { rank: list.length + 1 } : {}));
    }
    if (act === 'del') {
      list.splice(i, 1);
      if (b.dataset.list === 'options') {
        draft.correct = toArr(draft.correct).map(Number).filter(n => n !== i).map(n => (n > i ? n - 1 : n));
        if (!draft.correct.length) draft.correct = [0];
      }
      if (b.dataset.list === 'entries' && draft.type === 'order') normRanks(draft.entries);
      if (b.dataset.list === 'groups') draft.entries.forEach(en => { if (en.group >= list.length) en.group = 0; });
    }
    if (act === 'rmimg') list[i][b.dataset.k] = '';
    if (act === 'rmqimg') draft.img = '';
    if (act === 'up' || act === 'down') {
      const j = act === 'up' ? i - 1 : i + 1, E = draft.entries;
      [E[i], E[j]] = [E[j], E[i]];
      if (draft.type === 'order') { [E[i].rank, E[j].rank] = [E[j].rank, E[i].rank]; normRanks(E); }
    }
    if (act === 'cancel') { draft = blankDraft('choice'); renderList(); }
    if (act === 'save') {
      const { q, key, errors } = fromDraft(draft);
      if (errors.length) { document.getElementById('errs').innerHTML = errors.map(esc).join('<br>'); return; }
      const old = questions[q.id];
      q.order = old ? (old.order || 0) : Object.keys(questions).length
        ? Math.max(...Object.values(questions).map(x => x.order || 0)) + 1 : 0;
      await E.update('', { ['questions/' + q.id]: q, ['keys/' + q.id]: key });
      toast('問題を保存しました');
      draft = blankDraft(draft.type);
      renderList();
    }
    renderEditor();
  });

  const toast = (msg, type) => Q.toast(msg, type);
})();
</script>
</body>
</html>
