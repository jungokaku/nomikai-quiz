<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題作成</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e1b3a">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="admin">
<div class="p-head"><span id="appTitle"></span><span class="head-links"><button id="btnSwitch" class="ghost">開催を切り替え</button><a href="host.html" target="_blank">進行・投影画面を開く ↗</a></span></div>
<div class="a-wrap">
  <div class="a-side">
  <div class="a-panel" id="evPanel"></div>
  <div class="a-panel">
    <h2>問題一覧 <span class="sub" id="qcount"></span></h2>
    <div class="qlist" id="qlist"></div>
    <div class="a-actions"><button class="primary" id="btnNew">＋ 新しい問題</button></div>
  </div>
  </div>
  <div class="a-panel" id="editor"></div>
</div>

<script>
(function () {
  const { Store, TYPES, LETTERS, CIRCLED, esc, uid, toArr, sortedQuestions } = Q;
  document.title = '問題作成｜' + Q.C.APP_TITLE;
  document.getElementById('appTitle').textContent = Q.C.APP_TITLE + '｜問題作成';

  let questions = {}, keys = {}, roster = {}, players = {}, meta = {}, catalog = {}, hasBgm = false;
  let draft = null, E = null, EID = '', lastCounts = '';

  Q.demoBanner();
  Q.eventGate(start, 'admin');

  function start(eid) {
    EID = eid; E = Q.scope('events/' + eid);
    Q.setImageBase('events/' + eid + '/images/');
    E.listen('questions', v => { questions = v || {}; renderList(); syncCounts(); });
    E.listen('keys', v => { keys = v || {}; });
    E.listen('roster', v => { roster = v || {}; renderEvent(); syncCounts(); });
    E.listen('players', v => { players = v || {}; });
    E.listen('bgmName', v => { hasBgm = v || ''; renderEvent(); });
    Store.listen('catalog', v => { catalog = v || {}; meta = catalog[eid] || {}; renderEvent(); document.title = (meta.title || '') + '｜問題作成'; });
    document.getElementById('btnNew').onclick = () => { draft = blankDraft('choice'); renderEditor(); };
    document.getElementById('btnSwitch').onclick = () => Q.leaveEvent();
    draft = blankDraft('choice');
    renderEditor();
  }
  // 開催一覧に出す件数を更新
  function syncCounts() {
    const qn = Object.keys(questions).length, rn = Object.keys(roster).length;
    const sig = qn + '/' + rn;
    if (meta.title && sig !== lastCounts && (meta.qCount !== qn || meta.rosterCount !== rn)) { lastCounts = sig; Store.update('catalog/' + EID, { qCount: qn, rosterCount: rn }); }
  }

  // ---------- 開催の設定 ----------
  let evOpen = false;
  function renderEvent() {
    const el = document.getElementById('evPanel');
    if (!meta.title) { el.innerHTML = ''; return; }
    const names = Object.entries(roster).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
    const others = Object.entries(catalog).filter(([id]) => id !== EID).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    const focused = document.activeElement && el.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON';
    if (focused) return;
    el.innerHTML = `<div class="ev-head"><div><div class="sub" style="font-size:12px">編集中の開催</div><h2 class="ev-title">${esc(meta.title)}</h2>
        <div class="sub" style="font-size:13px">問題 ${Object.keys(questions).length}問 ・ 名簿 ${names.length}人</div></div>
        <button id="evToggle">${evOpen ? '閉じる' : '設定'}</button></div>
      ${evOpen ? `
      <div class="field"><label>タイトル（スクリーンとスマホに表示）</label>
        <div class="row"><input id="evTitle" maxlength="30" value="${esc(meta.title)}"><button id="evTitleSave">変更</button></div></div>
      <div class="field"><label>パスワードの変更</label>
        <div class="row"><input id="evPass" type="password" autocomplete="new-password" placeholder="新しいパスワード（4文字以上）"><button id="evPassSave">変更</button></div></div>
      <div class="field"><label>参加者名簿（${names.length}人）</label>
        <div class="rchips">${names.map(([rid, r]) => `<span class="rchip">${esc(r.name)}<button data-delr="${rid}" aria-label="${esc(r.name)}を削除">×</button></span>`).join('') || '<span class="sub">名簿なし（当日その場で名前を入力して参加）</span>'}</div>
        <textarea id="evAdd" rows="2" placeholder="名前を追加（改行・読点・カンマ区切りでまとめて入力できます）"></textarea>
        <div class="row"><button id="evAddBtn">名簿に追加</button>${names.length ? '<button id="evClear" class="danger">名簿を空にする</button>' : ''}</div>
        ${others.length ? `<div class="row" style="margin-top:8px"><select id="evFrom">${others.map(([id, m]) => `<option value="${id}">${esc(m.title)}</option>`).join('')}</select><button id="evFromBtn">から引き継ぐ</button></div>
        <p class="mini">選んだ開催の名簿と、実際に参加した人の名前をまとめて追加します（同じ名前は1つにまとめます）。</p>` : ''}</div>
      <div class="field"><label>BGM（任意）</label>
        ${hasBgm ? `<div class="row"><span class="sub">🎵 ${esc(hasBgm)}</span><button id="evBgmDel">削除</button></div>`
          : `<label class="up file">🎵 音源ファイルを選ぶ（mp3など・4MBまで）<input type="file" accept="audio/*" id="evBgm"></label>`}
        <p class="mini">登録すると、受付中と順位表示のBGMがこの音源になります。未登録なら自動で作った音楽が流れます。著作権に問題のない音源を使ってください。</p></div>
      <div class="field"><button id="evDel" class="danger">この開催を削除</button></div>` : ''}`;
    const $ = id => document.getElementById(id);
    $('evToggle').onclick = () => { evOpen = !evOpen; renderEvent(); };
    if (!evOpen) return;
    $('evTitleSave').onclick = async () => {
      const t = $('evTitle').value.trim(); if (!t) return toast('タイトルを入れてください', 'warn');
      await Store.update('catalog/' + EID, { title: t }); toast('タイトルを変更しました');
    };
    $('evPassSave').onclick = async () => {
      const p = $('evPass').value; if (p.length < 4) return toast('パスワードは4文字以上にしてください', 'warn');
      await Store.update('catalog/' + EID, { passHash: await Q.hashPass(p) });
      try { sessionStorage.setItem('quiz_' + (Q.C.ROOM_ID || 'nomikai') + '_evh', await Q.hashPass(p)); } catch (e) {}
      $('evPass').value = ''; toast('パスワードを変更しました');
    };
    const addNames = async list => {
      const have = new Set(Object.values(roster).map(r => r.name));
      const add = [...new Set(list.map(n => n.trim()).filter(n => n && !have.has(n)))];
      if (!add.length) return toast('追加する名前がありません（同じ名前は追加しません）', 'info');
      const start = Object.keys(roster).length, upd = {};
      Object.entries(Q.rosterFromNames(add, start)).forEach(([k, v]) => { upd[k] = v; });
      await E.update('roster', upd); toast(`${add.length}人を名簿に追加しました`);
    };
    $('evAddBtn').onclick = () => { const v = $('evAdd').value; $('evAdd').value = ''; addNames(v.split(/[\n,、，]+/)); };
    if ($('evClear')) $('evClear').onclick = async () => { if (confirm('名簿を空にしますか？')) { await E.set('roster', null); toast('名簿を空にしました', 'info'); } };
    if ($('evFromBtn')) $('evFromBtn').onclick = async () => {
      const src = await Store.get('events/' + $('evFrom').value);
      addNames(Q.rosterNames(src));
    };
    el.querySelectorAll('[data-delr]').forEach(b => b.onclick = () => E.set('roster/' + b.dataset.delr, null));
    if ($('evBgm')) $('evBgm').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 4 * 1024 * 1024) return toast('4MBまでの音源ファイルを選んでください', 'warn');
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); });
      await E.update('', { bgm: url, bgmName: f.name }); toast('BGMを登録しました');
    };
    if ($('evBgmDel')) $('evBgmDel').onclick = async () => { await E.update('', { bgm: null, bgmName: null }); toast('BGMを削除しました', 'info'); };
    $('evDel').onclick = async () => {
      const t = prompt(`「${meta.title}」を問題・名簿・回答ごと削除します。元に戻せません。\n削除する場合は「削除」と入力してください。`);
      if (t !== '削除') return;
      const lv = await Store.get('live');
      await Store.update('', Object.assign({ ['events/' + EID]: null, ['catalog/' + EID]: null }, lv && lv.eid === EID ? { live: null } : {}));
      Q.leaveEvent();
    };
  }
  document.getElementById('evPanel').addEventListener('focusout', () => setTimeout(() => {
    const el = document.getElementById('evPanel');
    if (!el.contains(document.activeElement)) renderEvent();
  }, 0));

  // ---------- 下書き（編集用の形）----------
  function blankEntry() { return { text: '', img: '', photo: '', word: '', group: 0, note: '' }; }
  function blankDraft(type) {
    return {
      id: null, type, title: '', timeLimit: 30, shuffle: true, points: 1,
      hints: [], explain: '', topLabel: '', bottomLabel: '',
      options: [{ text: '', img: '', note: '' }, { text: '', img: '', note: '' }], correct: 0,
      entries: [blankEntry(), blankEntry(), blankEntry(), blankEntry()],
      groups: ['グループ1', 'グループ2']
    };
  }
  function toDraft(q, key) {
    const d = blankDraft(q.type);
    d.id = q.id; d.title = q.title || ''; d.timeLimit = q.timeLimit || 0;
    d.points = Number(q.points) || 1; d.hints = toArr(q.hints).slice(); d.explain = q.explain || '';
    d.topLabel = q.topLabel || ''; d.bottomLabel = q.bottomLabel || '';
    const items = toArr(q.items), slots = toArr(q.slots), k = toArr(key);
    if (q.type === 'choice') {
      d.options = toArr(q.options).map(o => ({ text: o.text || '', img: o.img || '', note: o.note || '' }));
      d.correct = Number(key) || 0;
    } else if (q.type === 'order') {
      d.entries = items.map((it, j) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', _r: Number(k[j]) }))
        .sort((a, b) => a._r - b._r).map(({ _r, ...e }) => e);
    } else if (q.type === 'match') {
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', photo: (slots[Number(k[i])] || {}).img || '' }));
    } else if (q.type === 'pair') {
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', note: it.note || '', word: (slots[Number(k[i])] || {}).text || '' }));
    } else if (q.type === 'group') {
      d.groups = slots.map(s => s.text || '');
      d.entries = items.map((it, i) => ({ ...blankEntry(), text: it.text || '', img: it.img || '', note: it.note || '', group: Number(k[i]) || 0 }));
      d.shuffle = false;
    }
    return d;
  }
  function shuffled(n, doShuffle) {
    const a = [...Array(n).keys()];
    if (doShuffle) for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // 下書き → 保存する形（問題 q と正解 key）。エラーがあれば errors に入れる
  function fromDraft(d) {
    const errors = [];
    const q = { id: d.id || uid(), type: d.type, title: d.title.trim(), timeLimit: Math.max(0, parseInt(d.timeLimit, 10) || 0),
      points: Number(d.points) || 1 };
    const hints = d.hints.map(h => (h || '').trim()).filter(Boolean).slice(0, 5);
    if (hints.length) q.hints = hints;
    if ((d.explain || '').trim()) q.explain = d.explain.trim();
    const nt = o => ((o && o.note) || '').trim();
    let key;
    if (!q.title) errors.push('問題文を入力してください');
    const has = e => (e.text || '').trim() || e.img;
    if (d.type === 'choice') {
      if (d.options.length < 2) errors.push('選択肢は2つ以上必要です');
      if (d.options.some(o => !has(o))) errors.push('空の選択肢があります（文字か画像を入れてください）');
      q.options = d.options.map(o => ({ text: (o.text || '').trim(), img: o.img || '', note: nt(o) }));
      key = Math.min(d.correct, d.options.length - 1);
    } else {
      const E = d.entries;
      if (E.length < 2) errors.push('項目は2つ以上必要です');
      if (E.some(e => !has(e))) errors.push('空の項目があります（文字か画像を入れてください）');
      if (d.type === 'order') {
        const p = shuffled(E.length, d.shuffle);           // p[j] = 表示位置jに来る項目の正解順位
        q.items = p.map(r => ({ text: E[r].text.trim(), img: E[r].img || '', note: nt(E[r]) }));
        q.slots = E.map(() => ({ text: '', img: '' }));
        key = p.slice();
        if (d.topLabel.trim()) q.topLabel = d.topLabel.trim();
        if (d.bottomLabel.trim()) q.bottomLabel = d.bottomLabel.trim();
      } else if (d.type === 'match') {
        if (E.some(e => !e.photo)) errors.push('写真が入っていない項目があります');
        const s = shuffled(E.length, true);                // s[k] = 写真番号kに来る項目
        q.items = E.map(e => ({ text: e.text.trim(), img: e.img || '', note: nt(e) }));
        q.slots = s.map(i => ({ text: '', img: E[i].photo || '' }));
        key = E.map((_, i) => s.indexOf(i));
      } else if (d.type === 'pair') {
        if (E.some(e => !(e.word || '').trim())) errors.push('右側の言葉が空の行があります');
        const s = shuffled(E.length, true);                // s[k] = 言葉の番号kに来る項目
        q.items = E.map(e => ({ text: e.text.trim(), img: '', note: nt(e) }));
        q.slots = s.map(i => ({ text: (E[i].word || '').trim(), img: '' }));
        key = E.map((_, i) => s.indexOf(i));
      } else if (d.type === 'group') {
        const G = d.groups.map(g => (g || '').trim());
        if (G.length < 2) errors.push('グループは2つ以上必要です');
        if (G.some(g => !g)) errors.push('グループ名が空です');
        const p = shuffled(E.length, d.shuffle);
        q.items = p.map(i => ({ text: E[i].text.trim(), img: E[i].img || '', note: nt(E[i]) }));
        q.slots = G.map(g => ({ text: g, img: '' }));
        key = p.map(i => Math.min(Number(E[i].group) || 0, G.length - 1));
      }
    }
    return { q, key, errors };
  }
  function imagesOf(q) {
    const ids = [];
    ['options', 'items', 'slots'].forEach(f => toArr(q[f]).forEach(o => { if (o && o.img) ids.push(o.img); }));
    return ids;
  }

  // ---------- 一覧 ----------
  const PTS = [0.5, 1, 1.5, 2, 3, 5, 10];
  function renderList() {
    const qs = sortedQuestions(questions);
    const total = qs.reduce((a, q) => a + (Number(q.points) || 1), 0);
    document.getElementById('qcount').textContent = qs.length + '問' + (qs.length ? `・満点 ${Q.fmt(total)}点` : '');
    const el = document.getElementById('qlist');
    if (!qs.length) { el.innerHTML = '<p class="sub">まだ問題がありません。「新しい問題」から作成してください。</p>'; return; }
    el.innerHTML = qs.map((q, i) => `
      <div class="qitem ${draft && draft.id === q.id ? 'active' : ''}">
        <div><div class="t">Q${i + 1}. ${esc(q.title)}</div><span class="badge">${esc(TYPES[q.type].short)}</span>
          ${q.timeLimit ? `<span class="sub">　${q.timeLimit}秒</span>` : ''}${toArr(q.hints).length ? `<span class="sub">　ヒント${toArr(q.hints).length}</span>` : ''}
          <label class="ptsel">配点<select data-pts="${q.id}" aria-label="Q${i + 1}の配点倍率">${PTS.map(v => `<option value="${v}" ${Number(q.points || 1) === v ? 'selected' : ''}>×${v}</option>`).join('')}</select></label></div>
        <div class="ops">
          <button data-op="up" data-id="${q.id}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-op="down" data-id="${q.id}" ${i === qs.length - 1 ? 'disabled' : ''}>↓</button>
          <button data-op="edit" data-id="${q.id}">編集</button>
          <button data-op="del" data-id="${q.id}" class="danger">削除</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('qlist').addEventListener('change', async e => {
    const s = e.target.closest('select[data-pts]'); if (!s) return;
    await E.set('questions/' + s.dataset.pts + '/points', Number(s.value));
    if (draft && draft.id === s.dataset.pts) { draft.points = Number(s.value); renderEditor(); }
    toast(`配点を ×${s.value} にしました`);
  });
  document.getElementById('qlist').addEventListener('click', async e => {
    const b = e.target.closest('button[data-op]'); if (!b) return;
    const qs = sortedQuestions(questions);
    const i = qs.findIndex(q => q.id === b.dataset.id); const q = qs[i];
    if (b.dataset.op === 'edit') { draft = toDraft(q, keys[q.id]); renderEditor(); renderList(); }
    if (b.dataset.op === 'del') {
      if (!confirm(`「${q.title}」を削除しますか？`)) return;
      const upd = { ['questions/' + q.id]: null, ['keys/' + q.id]: null };
      imagesOf(q).forEach(id => { upd['images/' + id] = null; });
      await E.update('', upd);
      toast('問題を削除しました', 'info');
      if (draft && draft.id === q.id) { draft = blankDraft('choice'); renderEditor(); }
    }
    if (b.dataset.op === 'up' || b.dataset.op === 'down') {
      const j = b.dataset.op === 'up' ? i - 1 : i + 1;
      const upd = {};
      qs.forEach((x, n) => { upd['questions/' + x.id + '/order'] = n; });
      upd['questions/' + qs[i].id + '/order'] = j;
      upd['questions/' + qs[j].id + '/order'] = i;
      await E.update('', upd);
    }
  });

  // ---------- 編集フォーム ----------
  function imgBox(list, i, k, id, label) {
    return `<div class="imgbox">${id ? `<img data-img="${esc(id)}"><button data-act="rmimg" data-list="${list}" data-i="${i}" data-k="${k}">×</button>`
      : `<label class="up">📷 ${label}<input type="file" accept="image/*" data-list="${list}" data-i="${i}" data-k="${k}"></label>`}</div>`;
  }
  function renderEditor() {
    const d = draft, el = document.getElementById('editor');
    let body = '';
    if (d.type === 'choice') {
      body = `<div class="field"><label>選択肢（正解にチェック）</label>
        ${d.options.map((o, i) => `<div class="erow">
          <div class="lab">${i + 1}</div>
          <input data-list="options" data-i="${i}" data-k="text" value="${esc(o.text)}" placeholder="選択肢の文字（画像だけでもOK）">
          <div class="imgs">${imgBox('options', i, 'img', o.img, '画像')}</div>
          <div class="ctrl"><label><input type="radio" name="correct" data-f="correct" value="${i}" ${d.correct === i ? 'checked' : ''} style="width:auto"> 正解</label>
            <button data-act="del" data-list="options" data-i="${i}" ${d.options.length <= 2 ? 'disabled' : ''}>削除</button></div>
        </div>`).join('')}
        <button data-act="add" data-list="options" ${d.options.length >= 6 ? 'disabled' : ''}>＋ 選択肢を追加</button>
        <p class="mini">例：「1位は誰？」は候補を並べて1つ正解に。「どっちがAさんの絵？」は画像2枚を入れて正解を選択。</p></div>`;
    } else if (d.type === 'order') {
      body = `<div class="field"><label>並べる基準（任意・スクリーンとスマホに表示）</label>
        <div class="row"><input data-f="topLabel" value="${esc(d.topLabel)}" placeholder="一番上（例：北）" maxlength="12">
          <span class="pairarrow">→</span><input data-f="bottomLabel" value="${esc(d.bottomLabel)}" placeholder="一番下（例：南）" maxlength="12"></div>
        <p class="mini">例：「出身地が北の人から順番に」→ 一番上「北」、一番下「南」。空欄なら表示しません。</p></div>
        <div class="field"><label>項目を<b>正解の順番（①が先頭）</b>で入力してください</label>
        ${d.entries.map((e, i) => `<div class="erow">
          <div class="lab">${CIRCLED[i]}</div>
          <input data-list="entries" data-i="${i}" data-k="text" value="${esc(e.text)}" placeholder="項目名（例：田中さん）">
          <div class="imgs">${imgBox('entries', i, 'img', e.img, '画像')}</div>
          <div class="ctrl"><button data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑</button><button data-act="down" data-i="${i}" ${i === d.entries.length - 1 ? 'disabled' : ''}>↓</button>
            <button data-act="del" data-list="entries" data-i="${i}" ${d.entries.length <= 2 ? 'disabled' : ''}>削除</button></div>
        </div>`).join('')}
        <button data-act="add" data-list="entries" ${d.entries.length >= 8 ? 'disabled' : ''}>＋ 項目を追加</button>
        <p class="mini"><label><input type="checkbox" data-f="shuffle" ${d.shuffle ? 'checked' : ''} style="width:auto"> 保存時にA・B・C…の並びをシャッフルする</label></p></div>`;
    } else if (d.type === 'match') {
      body = `<div class="field"><label>項目と<b>正解の写真</b>をペアで入力（写真の①②…の番号は保存時に自動でシャッフル）</label>
        ${d.entries.map((e, i) => `<div class="erow">
          <div class="lab">${LETTERS[i]}</div>
          <input data-list="entries" data-i="${i}" data-k="text" value="${esc(e.text)}" placeholder="項目名（例：田中さん）">
          <div class="imgs">${imgBox('entries', i, 'photo', e.photo, '正解の写真')}</div>
          <div class="ctrl"><button data-act="del" data-list="entries" data-i="${i}" ${d.entries.length <= 2 ? 'disabled' : ''}>削除</button></div>
        </div>`).join('')}
        <button data-act="add" data-list="entries" ${d.entries.length >= 8 ? 'disabled' : ''}>＋ ペアを追加</button>
        <p class="mini">例：「子どもの頃の写真は誰？」→ A 田中さん＋田中さんの写真…</p></div>`;
    } else if (d.type === 'pair') {
      body = `<div class="field"><label>左の言葉と<b>正解の右の言葉</b>をペアで入力（右側の①②…の番号は保存時に自動でシャッフル）</label>
        ${d.entries.map((e, i) => `<div class="erow pairrow">
          <div class="lab">${LETTERS[i]}</div>
          <input data-list="entries" data-i="${i}" data-k="text" value="${esc(e.text)}" placeholder="左（例：田中さん）">
          <span class="pairarrow" aria-hidden="true">↔</span>
          <input data-list="entries" data-i="${i}" data-k="word" value="${esc(e.word || '')}" placeholder="右（例：カレーが大好き）">
          <div class="ctrl"><button data-act="del" data-list="entries" data-i="${i}" ${d.entries.length <= 2 ? 'disabled' : ''}>削除</button></div>
        </div>`).join('')}
        <button data-act="add" data-list="entries" ${d.entries.length >= 8 ? 'disabled' : ''}>＋ ペアを追加</button>
        <p class="mini">例：「好きな食べ物はどれ？」→ A 田中さん ↔ カレー、B 佐藤さん ↔ ラーメン…。右側の言葉は短め（15文字くらいまで）がスマホで見やすくなります。</p></div>`;
    } else if (d.type === 'group') {
      body = `<div class="field"><label>グループ名</label>
        ${d.groups.map((g, i) => `<div class="erow" style="grid-template-columns:34px 1fr auto">
          <div class="lab">${i + 1}</div><input data-list="groups" data-i="${i}" value="${esc(g)}" placeholder="例：パクチー食べれる">
          <div class="ctrl"><button data-act="del" data-list="groups" data-i="${i}" ${d.groups.length <= 2 ? 'disabled' : ''}>削除</button></div></div>`).join('')}
        <button data-act="add" data-list="groups" ${d.groups.length >= 4 ? 'disabled' : ''}>＋ グループを追加</button></div>
        <div class="field"><label>項目と正解のグループ</label>
        ${d.entries.map((e, i) => `<div class="erow">
          <div class="lab">${LETTERS[i]}</div>
          <input data-list="entries" data-i="${i}" data-k="text" value="${esc(e.text)}" placeholder="項目名（例：田中さん）">
          <div class="imgs">${imgBox('entries', i, 'img', e.img, '画像')}
            <select data-list="entries" data-i="${i}" data-k="group">${d.groups.map((g, k) => `<option value="${k}" ${Number(e.group) === k ? 'selected' : ''}>${esc(g || ('グループ' + (k + 1)))}</option>`).join('')}</select></div>
          <div class="ctrl"><button data-act="del" data-list="entries" data-i="${i}" ${d.entries.length <= 2 ? 'disabled' : ''}>削除</button></div>
        </div>`).join('')}
        <button data-act="add" data-list="entries" ${d.entries.length >= 8 ? 'disabled' : ''}>＋ 項目を追加</button>
        <p class="mini"><label><input type="checkbox" data-f="shuffle" ${d.shuffle ? 'checked' : ''} style="width:auto"> 保存時にA・B・C…の並びをシャッフルする</label></p></div>`;
    }

    el.innerHTML = `<h2>${d.id ? '問題を編集' : '新しい問題'}</h2>
      <div class="field"><label>問題の形式</label>
        <select data-f="type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${d.type === k ? 'selected' : ''}>${t.name}</option>`).join('')}</select></div>
      <div class="field"><label>問題文</label><textarea data-f="title" rows="2" placeholder="例：パクチーを食べられるのは誰？">${esc(d.title)}</textarea></div>
      <div class="field"><label>制限時間（秒・0で無制限）</label><input type="number" min="0" step="5" data-f="timeLimit" value="${d.timeLimit}" style="width:120px"></div>
      ${body}
      ${extrasHtml(d)}
      <p class="err" id="errs"></p>
      <div class="a-actions"><button class="primary" data-act="save">保存</button>
        ${d.id ? '<button data-act="cancel">新規作成に戻る</button>' : ''}</div>`;
    Q.hydrateImages(el);
  }

  // 配点・ヒント・説明（すべて任意）
  function extrasHtml(d) {
    const lab = i => d.type === 'choice' ? String(i + 1) : d.type === 'order' ? CIRCLED[i] : LETTERS[i];
    const src = d.type === 'choice' ? d.options : d.entries;
    const listKey = d.type === 'choice' ? 'options' : 'entries';
    const nm = o => esc((o.text || '').trim() || (o.img ? '（画像）' : '（未入力）'));
    return `<div class="extras">
      <div class="field"><label>配点倍率</label>
        <select data-f="points" style="width:auto">${PTS.map(v => `<option value="${v}" ${Number(d.points) === v ? 'selected' : ''}>×${v}（満点 ${Q.fmt(v)}点）</option>`).join('')}</select>
        <p class="mini">問題一覧からも変更できます。</p></div>
      <div class="field"><label>ヒント（任意・最大5つ。進行画面の「ヒント」ボタンで1つずつ表示）</label>
        ${d.hints.map((h, i) => `<div class="erow" style="grid-template-columns:34px 1fr auto"><div class="lab">${i + 1}</div>
          <input data-list="hints" data-i="${i}" value="${esc(h)}" placeholder="例：寒いところの出身です" maxlength="60">
          <div class="ctrl"><button data-act="del" data-list="hints" data-i="${i}">削除</button></div></div>`).join('')}
        <button data-act="add" data-list="hints" ${d.hints.length >= 5 ? 'disabled' : ''}>＋ ヒントを追加</button></div>
      <div class="field"><label>回答ごとの説明（任意・正解発表のときに表示）</label>
        ${src.map((o, i) => `<div class="erow notes"><div class="lab">${lab(i)}</div><div class="nname">${nm(o)}</div>
          <input data-list="${listKey}" data-i="${i}" data-k="note" value="${esc(o.note || '')}" placeholder="例：北海道・札幌市の出身" maxlength="60"></div>`).join('')}</div>
      <div class="field"><label>全体の説明（任意・正解発表のときに表示）</label>
        <textarea data-f="explain" rows="2" maxlength="200" placeholder="例：意外と九州出身の人が多い会社でした">${esc(d.explain)}</textarea></div>
    </div>`;
  }

  const ed = document.getElementById('editor');
  ed.addEventListener('input', e => {
    const t = e.target;
    if (t.type === 'file' || t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT') return;
    setValue(t, t.value);
  });
  ed.addEventListener('change', async e => {
    const t = e.target;
    if (t.type === 'file') {
      const f = t.files[0]; if (!f) return;
      try {
        const data = await Q.compressImage(f);
        const id = 'img_' + uid();
        await E.set('images/' + id, data);
        draft[t.dataset.list][+t.dataset.i][t.dataset.k] = id;
        renderEditor();
        toast('画像を追加しました', 'info');
      } catch (err) { toast('画像を読み込めませんでした。JPEGかPNGを選んでください', 'warn'); }
      return;
    }
    if (t.type === 'radio') { draft.correct = +t.value; return; }
    if (t.type === 'checkbox') { draft[t.dataset.f] = t.checked; return; }
    if (t.tagName === 'SELECT') {
      if (t.dataset.f === 'type') { draft.type = t.value; renderEditor(); return; }
      if (t.dataset.f === 'points') { draft.points = Number(t.value); return; }
      setValue(t, +t.value);
    }
  });
  function setValue(t, v) {
    if (t.dataset.f) { draft[t.dataset.f] = v; return; }
    const list = draft[t.dataset.list], i = +t.dataset.i;
    if (!list) return;
    if (t.dataset.k) list[i][t.dataset.k] = v; else list[i] = v;
  }
  ed.addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const act = b.dataset.act, list = draft[b.dataset.list], i = +b.dataset.i;
    if (act === 'add') {
      if (b.dataset.list === 'options') list.push({ text: '', img: '', note: '' });
      else if (b.dataset.list === 'groups') list.push('グループ' + (list.length + 1));
      else if (b.dataset.list === 'hints') { if (list.length < 5) list.push(''); }
      else list.push(blankEntry());
    }
    if (act === 'del') {
      list.splice(i, 1);
      if (b.dataset.list === 'options' && draft.correct >= list.length) draft.correct = 0;
      if (b.dataset.list === 'groups') draft.entries.forEach(en => { if (en.group >= list.length) en.group = 0; });
    }
    if (act === 'rmimg') list[i][b.dataset.k] = '';
    if (act === 'up' || act === 'down') {
      const j = act === 'up' ? i - 1 : i + 1, E = draft.entries;
      [E[i], E[j]] = [E[j], E[i]];
    }
    if (act === 'cancel') { draft = blankDraft('choice'); renderList(); }
    if (act === 'save') {
      const { q, key, errors } = fromDraft(draft);
      if (errors.length) { document.getElementById('errs').innerHTML = errors.map(esc).join('<br>'); return; }
      const old = questions[q.id];
      q.order = old ? (old.order || 0) : Object.keys(questions).length
        ? Math.max(...Object.values(questions).map(x => x.order || 0)) + 1 : 0;
      await E.update('', { ['questions/' + q.id]: q, ['keys/' + q.id]: key });
      toast('問題を保存しました');
      draft = blankDraft(draft.type);
      renderList();
    }
    renderEditor();
  });

  const toast = (msg, type) => Q.toast(msg, type);
})();
</script>
</body>
</html>
