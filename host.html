<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進行・投影画面</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="host">
<div id="stage">
  <div id="topbar"><span id="qnum"></span><span id="qtype"></span><span id="answered"></span><span id="timer"></span></div>
  <div id="main"></div>
  <div id="chips" class="chips"></div>
</div>
<div id="controls">
  <span class="phase" id="phaseLabel"></span>
  <button class="primary" id="btnNext"></button>
  <button id="btnClose">締切</button>
  <button id="btnReveal">正解発表</button>
  <button id="btnRank">順位を表示</button>
  <button id="btnLobby">参加QR</button>
  <select id="selP"></select><button id="btnSpot">この人の結果</button>
  <select id="selQ"></select><button id="btnGo">この問題を出す</button>
  <button id="btnReset" class="danger">リセット</button>
  <a href="admin.html" target="_blank">問題作成 ↗</a>
  <span class="hint">Space/→：次へ　H：この操作バーを隠す</span>
</div>

<script>
(function () {
  const { Store, TYPES, LETTERS, esc, fmt, toArr, sortedQuestions, slotLabel } = Q;
  document.title = Q.C.APP_TITLE + '｜投影';
  const $ = id => document.getElementById(id);
  const S = { state: { phase: 'lobby' }, questions: {}, players: {}, answers: {}, keys: {}, results: {}, scores: {} };
  let lastSig = '', closing = false;

  Q.demoBanner();
  Q.pinGate(start);

  function start() {
    ['state', 'questions', 'players', 'answers', 'keys', 'results', 'scores'].forEach(k => {
      Store.listen(k, v => { S[k] = v || (k === 'state' ? { phase: 'lobby' } : {}); render(); });
    });
    setInterval(tick, 250);
    bindControls();
  }

  const qs = () => sortedQuestions(S.questions);
  const curIdx = () => qs().findIndex(q => q.id === S.state.qid);
  const curQ = () => S.questions[S.state.qid] || null;
  const answersOf = qid => S.answers[qid] || {};
  const isRevealed = qid => !!(S.state.revealed && S.state.revealed[qid]);
  const joinUrl = () => new URL('index.html', location.href).href;

  // ========== 進行 ==========
  function showQuestion(idx) {
    const q = qs()[idx]; if (!q) return;
    return Store.update('state', { phase: 'question', qid: q.id, startedAt: Store.now(), revealKey: null });
  }
  function doClose() { return Store.update('state', { phase: 'closed' }); }
  function doReveal() {
    const q = curQ(); if (!q) return;
    const key = S.keys[q.id];
    const res = {};
    Object.entries(answersOf(q.id)).forEach(([pid, a]) => { res[pid] = Q.scoreAnswer(q, key, a && a.v); });
    const all = Object.assign({}, S.results, { [q.id]: res });
    const totals = {};
    Object.values(all).forEach(r => Object.entries(r || {}).forEach(([pid, p]) => { totals[pid] = (totals[pid] || 0) + p; }));
    return Store.update('', {
      ['results/' + q.id]: res, scores: totals,
      'state/phase': 'reveal', 'state/revealKey': key == null ? null : key,
      ['state/revealed/' + q.id]: true
    });
  }
  function next() {
    const ph = S.state.phase, i = curIdx(), n = qs().length;
    if (ph === 'lobby') return showQuestion(i >= 0 && isRevealed(S.state.qid) ? i + 1 : Math.max(i, 0));
    if (ph === 'question') return doClose();
    if (ph === 'closed') return doReveal();
    if (ph === 'reveal') return Store.update('state', { phase: 'ranking' });
    if ((ph === 'ranking' || ph === 'spotlight') && i + 1 < n) return showQuestion(i + 1);
  }
  function nextLabel() {
    const ph = S.state.phase, i = curIdx(), n = qs().length;
    if (!n) return '問題がありません';
    if (ph === 'lobby') return '▶ 出題スタート';
    if (ph === 'question') return '▶ 締切';
    if (ph === 'closed') return '▶ 正解発表';
    if (ph === 'reveal') return '▶ 途中経過';
    if (ph === 'ranking' || ph === 'spotlight') return i + 1 < n ? `▶ 次の問題（Q${i + 2}）` : '（全問終了）';
    return '▶ 次へ';
  }

  function bindControls() {
    $('btnNext').onclick = next;
    $('btnClose').onclick = doClose;
    $('btnReveal').onclick = doReveal;
    $('btnRank').onclick = () => Store.update('state', { phase: 'ranking' });
    $('btnLobby').onclick = () => Store.update('state', { phase: 'lobby' });
    $('btnSpot').onclick = () => { const p = $('selP').value; if (p) Store.update('state', { phase: 'spotlight', spotPid: p }); };
    $('btnGo').onclick = () => { const i = +$('selQ').value; if (i >= 0) showQuestion(i); };
    $('btnReset').onclick = () => {
      if (!confirm('参加者・回答・得点をすべて消して最初からにしますか？（問題は残ります）')) return;
      Store.update('', { players: null, answers: null, results: null, scores: null, state: { phase: 'lobby' } });
    };
    document.addEventListener('keydown', e => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
      if (e.key === 'h' || e.key === 'H') $('controls').classList.toggle('hidden');
    });
  }

  function tick() {
    const q = curQ(), st = S.state, el = $('timer');
    if (st.phase === 'question' && q && q.timeLimit > 0) {
      const rem = Math.ceil((st.startedAt + q.timeLimit * 1000 - Store.now()) / 1000);
      el.textContent = '⏱ ' + Math.max(0, rem);
      el.classList.toggle('warn', rem <= 5);
      if (rem <= 0 && !closing) { closing = true; Promise.resolve(doClose()).finally(() => { closing = false; }); }
    } else el.textContent = '';
  }

  // ========== 描画 ==========
  function render() {
    const st = S.state, q = curQ(), list = qs();
    const ph = q || ['lobby', 'ranking', 'spotlight'].includes(st.phase) ? st.phase : 'lobby';
    const sig = [ph, st.qid, st.phase === 'reveal' ? JSON.stringify(S.results[st.qid] || {}) : '',
      ph === 'ranking' || ph === 'spotlight' ? JSON.stringify(S.scores) + JSON.stringify(S.players) + JSON.stringify(st.revealed || {}) + st.spotPid : '',
      q ? JSON.stringify(q) : ''].join('|');
    if (sig !== lastSig) { lastSig = sig; renderMain(ph, q, list); }
    renderLive(ph, q, list);
    renderControls(list);
  }

  function renderControls(list) {
    const labels = { lobby: '受付中', question: '回答受付中', closed: '締切', reveal: '正解発表', ranking: '順位表示', spotlight: '個人の結果' };
    $('phaseLabel').textContent = labels[S.state.phase] || '';
    $('btnNext').textContent = nextLabel();
    const sel = $('selQ'), cur = curIdx();
    const html = list.map((q, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>Q${i + 1}. ${esc(q.title).slice(0, 24)}</option>`).join('');
    if (sel.dataset.h !== html) { sel.innerHTML = html; sel.dataset.h = html; }
    const sp = $('selP'), cp = sp.value || S.state.spotPid;
    const ph2 = '<option value="">参加者を選ぶ</option>' + Q.buildRanking(S.players, S.scores)
      .map(r => `<option value="${r.pid}" ${r.pid === cp ? 'selected' : ''}>${esc(r.name)}（${r.rank}位）</option>`).join('');
    if (sp.dataset.h !== ph2) { sp.innerHTML = ph2; sp.dataset.h = ph2; }
  }

  function renderLive(ph, q, list) {
    const pids = Object.keys(S.players);
    const i = curIdx();
    $('qnum').textContent = q && ph !== 'lobby' ? `Q${i + 1} / ${list.length}` : '';
    $('qtype').innerHTML = q && ph !== 'lobby' ? `<span class="badge">${esc(TYPES[q.type].short)}</span>` : '';
    if (ph === 'lobby') {
      $('answered').textContent = '';
      $('chips').innerHTML = '';
      const pc = $('pcount'); if (pc) pc.textContent = pids.length;
      const lc = $('lobbyChips');
      if (lc) lc.innerHTML = pids.map(p => `<span class="chip">${esc(S.players[p].name)}</span>`).join('');
      return;
    }
    if (q && (ph === 'question' || ph === 'closed')) {
      const ans = answersOf(q.id);
      const n = pids.filter(p => ans[p]).length;
      $('answered').textContent = `回答 ${n} / ${pids.length}人`;
      $('chips').innerHTML = pids.map(p => `<span class="chip ${ans[p] ? 'done' : ''}">${esc(S.players[p].name)}</span>`).join('');
    } else { $('answered').textContent = ''; $('chips').innerHTML = ''; }
  }

  const img = id => (id ? `<img data-img="${esc(id)}">` : '');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + '%';

  function renderMain(ph, q, list) {
    const m = $('main');
    if (ph === 'lobby') {
      m.innerHTML = `<div class="lobby">
        <div><h1>${esc(Q.C.APP_TITLE)}</h1><p style="font-size:3vh">スマホでQRを読み取って参加！</p>
          <div class="qrwrap"><div id="qr"></div></div><p class="url">${esc(joinUrl())}</p></div>
        <div><h2>参加者 <span id="pcount">0</span>人</h2><div id="lobbyChips" class="chips"></div></div></div>`;
      if (window.QRCode) new QRCode($('qr'), { text: joinUrl(), width: Math.round(innerHeight * 0.38), height: Math.round(innerHeight * 0.38) });
      else $('qr').textContent = 'QRライブラリを読み込めませんでした';
      return;
    }
    if (ph === 'ranking') { m.innerHTML = rankingHtml(list); return; }
    if (ph === 'spotlight') { m.innerHTML = spotlightHtml(list); return; }
    if (!q) { m.innerHTML = ''; return; }

    const head = `<div class="qtitle">${esc(q.title)}</div>`;
    if (ph === 'question' || ph === 'closed') {
      m.innerHTML = head + questionHtml(q) + (ph === 'closed' ? '<div class="overlay"><span>締切！</span></div>' : '');
    } else if (ph === 'reveal') {
      m.innerHTML = head + revealHtml(q);
    }
    Q.hydrateImages(m);
  }

  function hint(q) {
    const n = toArr(q.items).length;
    if (q.type === 'order') return `スマホで A〜${LETTERS[n - 1]} を並べ替えて回答（一番上が①）`;
    if (q.type === 'match') return `A〜${LETTERS[n - 1]} はそれぞれどの写真？ スマホで線をつないで回答`;
    if (q.type === 'group') return 'それぞれどのグループ？ スマホでカードを箱に入れて回答';
    return '';
  }
  function itemCards(items, extra) {
    return `<div class="cards">${items.map((it, i) => `<div class="card"><div class="lbl">${LETTERS[i]}</div>${img(it.img)}
      ${it.text ? `<div class="txt">${esc(it.text)}</div>` : ''}${extra ? extra(i) : ''}</div>`).join('')}</div>`;
  }

  function questionHtml(q) {
    const items = toArr(q.items), slots = toArr(q.slots);
    if (q.type === 'choice') {
      const opts = toArr(q.options);
      return `<div class="tiles" style="grid-template-columns:repeat(${opts.length <= 2 ? 2 : opts.length <= 4 ? 2 : 3},1fr)">
        ${opts.map((o, i) => `<div class="tile c${i}"><span class="num">${i + 1}</span>${img(o.img)}${o.text ? `<div class="txt">${esc(o.text)}</div>` : ''}</div>`).join('')}</div>`;
    }
    let h = `<div class="qhint">${hint(q)}</div>` + itemCards(items);
    if (q.type === 'match') {
      h += `<div class="cards photos">${slots.map((s, k) => `<div class="card c${k % 6}"><div class="lbl">${Q.CIRCLED[k]}</div>${img(s.img)}</div>`).join('')}</div>`;
    }
    if (q.type === 'group') {
      h += `<div class="groups">${slots.map((s, k) => `<div class="gbox"><h3>${esc(s.text)}</h3></div>`).join('')}</div>`;
    }
    return h;
  }

  function revealHtml(q) {
    const key = S.keys[q.id], ans = answersOf(q.id), res = S.results[q.id] || {};
    const answered = Object.keys(ans).length;
    const names = pids => pids.map(p => esc((S.players[p] || {}).name || '?')).join('、');
    if (q.type === 'choice') {
      const opts = toArr(q.options), cnt = opts.map(() => 0);
      Object.values(ans).forEach(a => { if (a && cnt[a.v] != null) cnt[a.v]++; });
      const winners = Object.keys(res).filter(p => res[p] >= 1);
      return `<div class="tiles" style="grid-template-columns:repeat(${opts.length <= 4 ? 2 : 3},1fr)">
        ${opts.map((o, i) => `<div class="tile c${i} ${Number(key) === i ? 'correct' : 'dim'}"><span class="num">${i + 1}</span>${img(o.img)}
          ${o.text ? `<div class="txt">${esc(o.text)}</div>` : ''}<span class="cnt">${cnt[i]}人</span>
          <span class="bar" style="width:${pct(cnt[i], answered)}"></span></div>`).join('')}</div>
        <div class="perfect"><span class="pc">正解者 <b>${winners.length}人</b> / ${answered}人</span>${winners.length && winners.length <= 30 ? '<span class="pn">' + names(winners) + '</span>' : ''}</div>`;
    }
    const items = toArr(q.items), slots = toArr(q.slots), k = toArr(key);
    const rate = i => pct(Object.values(ans).filter(a => a && toArr(a.v)[i] != null && Number(toArr(a.v)[i]) === Number(k[i])).length, answered);
    let h = '';
    if (q.type === 'order') {
      const byRank = items.map((it, j) => ({ it, j, r: Number(k[j]) })).sort((a, b) => a.r - b.r);
      h = `<div class="olist">${byRank.map(x => `<div class="orow"><span class="pos">${Q.CIRCLED[x.r]}</span>
        <span>${LETTERS[x.j]}</span>${img(x.it.img)}<span>${esc(x.it.text)}</span><span class="rate">正答率 ${rate(x.j)}</span></div>`).join('')}</div>`;
    } else if (q.type === 'match') {
      h = `<div class="cards">${items.map((it, i) => { const s = slots[Number(k[i])] || {}; return `<div class="card">
        <div class="lbl">${LETTERS[i]}</div>${it.text ? `<div class="txt">${esc(it.text)}</div>` : img(it.img)}
        <div class="ans">＝ ${Q.CIRCLED[Number(k[i])]}</div>${img(s.img)}<div class="rate">正答率 ${rate(i)}</div></div>`; }).join('')}</div>`;
    } else if (q.type === 'group') {
      h = `<div class="groups">${slots.map((s, g) => `<div class="gbox"><h3>${esc(s.text)}</h3><div class="cards">
        ${items.map((it, i) => (Number(k[i]) === g ? `<div class="card"><div class="lbl">${LETTERS[i]}</div>${img(it.img)}
          ${it.text ? `<div class="txt">${esc(it.text)}</div>` : ''}<div class="rate">正答率 ${rate(i)}</div></div>` : '')).join('')}</div></div>`).join('')}</div>`;
    }
    const perfect = Object.keys(res).filter(p => res[p] >= 0.999);
    const avg = answered ? Object.values(res).reduce((a, b) => a + b, 0) / answered : 0;
    return h + `<div class="perfect"><span class="pc">全問正解 <b>${perfect.length}人</b> / ${answered}人</span><span class="pc sub2">平均 ${fmt(avg)}点</span>${perfect.length && perfect.length <= 30 ? '<span class="pn">' + names(perfect) + '</span>' : ''}</div>`;
  }

  // 選んだ1人の結果（各問の回答・得点・順位）
  function answerText(q, v) {
    if (v == null) return '未回答';
    if (q.type === 'choice') { const o = toArr(q.options)[Number(v)] || {}; return `${Number(v) + 1}${o.text ? ' ' + esc(o.text) : ''}`; }
    return toArr(q.items).map((it, i) => `${LETTERS[i]}→${esc(slotLabel(q, Number(toArr(v)[i])))}`).join('　');
  }
  function spotlightHtml(list) {
    const pid = S.state.spotPid, p = S.players[pid];
    if (!p) return '<div class="rank"><h1>参加者が見つかりません</h1></div>';
    const rows = Q.buildRanking(S.players, S.scores), me = rows.find(r => r.pid === pid);
    const done = list.filter(q => isRevealed(q.id));
    const line = (q, i) => {
      const a = (answersOf(q.id)[pid] || {}).v, pt = (S.results[q.id] || {})[pid];
      const cls = pt == null ? 'none' : pt >= 0.999 ? 'ok' : pt > 0 ? 'part' : 'ng';
      const mark = { none: '－', ok: '○', part: '△', ng: '×' }[cls];
      return `<div class="srow ${cls}"><span class="sq">Q${list.indexOf(q) + 1}</span><span class="st">${esc(q.title)}</span>
        <span class="sa">${answerText(q, a)}</span><span class="sm">${mark}</span><span class="sp">${fmt(pt || 0)}点</span></div>`;
    };
    return `<div class="spot"><div class="spot-head"><div class="spot-name">📣 ${esc(p.name)} さんの結果</div>
      <div class="spot-sum"><b>${me ? me.rank : '-'}位</b> / ${rows.length}人　合計 <b>${fmt(me ? me.score : 0)}点</b></div></div>
      <div class="slist">${done.length ? done.map(line).join('') : '<p class="sub">まだ正解発表した問題がありません</p>'}</div></div>`;
  }

  function rankingHtml(list) {
    const done = list.filter(q => isRevealed(q.id)).length;
    const isFinal = list.length > 0 && done === list.length;
    const rows = Q.buildRanking(S.players, S.scores).slice(0, 10);
    return `<div class="rank"><h1>${isFinal ? '🏆 最終結果' : '途中経過'} <small>（${done}問終了・${Object.keys(S.players).length}人）</small></h1>
      <ol>${rows.map((r, i) => `<li class="${r.rank <= 3 ? 'top' + r.rank : ''}" style="animation-delay:${(rows.length - i) * 0.08}s">
        <span class="r">${r.rank}位</span><span>${esc(r.name)}</span><span class="s">${fmt(r.score)}点</span></li>`).join('')}</ol></div>`;
  }
})();
</script>
</body>
</html>
